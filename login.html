<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WAKA Real Estate - Login</title>


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    >


    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <style>

        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }


        .auth-card {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.15);

            width: 100%;
            max-width: 450px;

            border:
                1px solid rgba(0, 0, 0, 0.05);
        }


        .auth-card h2 {
            font-size: 2rem;
            color: #111;
            margin-bottom: 25px;
            text-align: center;
        }


        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }


        .form-group input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px 15px;

            border:
                1px solid #d1d5db;

            border-radius: 8px;

            background: #fff;
            color: #111;

            outline: none;

            font-size: 15px;
        }


        .form-group input:focus {
            border-color: #10b981;

            box-shadow:
                0 0 0 3px
                rgba(16, 185, 129, 0.1);
        }


        .auth-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 0.9rem;

            margin-bottom: 25px;
        }


        .remember-label {
            display: flex;
            align-items: center;

            gap: 5px;

            color: #555;

            cursor: pointer;
        }


        .remember-label input {
            width: auto;
        }


        .auth-meta a {
            color: red;

            text-decoration: none;

            font-weight: 600;
        }


        .auth-meta a:hover {
            text-decoration: underline;
        }


        .auth-btn {
            width: 100%;

            padding: 14px;

            font-size: 1rem;

            font-weight: bold;

            border-radius: 8px;

            margin-bottom: 20px;

            cursor: pointer;
        }


        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        .auth-footer {
            text-align: center;
            color: #111;
        }


        .auth-footer a {
            color: #111;

            text-decoration: none;

            font-weight: bold;
        }


        .auth-footer i {
            color: red;
        }


        .error-msg {
            background-color: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 8px;

            font-size: 0.9rem;

            margin-bottom: 20px;

            display: none;

            text-align: center;

            border:
                1px solid #fca5a5;
        }


        .success-msg {
            background-color: #dcfce7;

            color: #166534;

            padding: 12px;

            border-radius: 8px;

            font-size: 0.9rem;

            margin-bottom: 20px;

            display: none;

            text-align: center;

            border:
                1px solid #86efac;
        }

    </style>

</head>


<body>

     HEADER
===================================================== -->

                WAKA

            </a>

        </section>

    </nav>



    <!-- MAIN NAV -->

    <nav class="navbar nav-2">

        <section class="flex">


            <div
                id="menu-btn"
                class="fas fa-bars"
            ></div>


            <div class="menu">

                <ul>


                    <li>

                        <a href="listings.html">
                            Buy
                        </a>

                    </li>



                    <li>

                        <a href="#">
                            Sell
                        </a>


                        <ul>

                            <li>

                                <a href="ap.html">

                                </a>

                            </li>

                        </ul>

                    </li>



                    <li>

                        <a href="rent.html">

                    </li>



                    <li>

                        <a href="#">
                            Help
                        </a>


                        <ul>

                            <li>

                                <a href="about.html">
                                    About Us
                                </a>

                            </li>


                            <li>

                                <a href="contact.html">
                                    Contact Us
                                </a>

                            </li>

                        </ul>

                    </li>


                </ul>

            </div>



            <!-- ACCOUNT -->

            <ul>

                <li>

                    <a href="#">
                        Account
                    </a>


                    <ul>

                        <li>

                            <a href="login.html">
                                Login
                            </a>

                        </li>


                        <li>

                        </li>

<!-- =====================================================
     LOGIN
===================================================== -->

<div class="auth-wrapper">


    <div class="auth-card">


        <h2>
            Welcome Back!
        </h2>



        <!-- ERROR -->

        <div
            class="error-msg"
            id="loginError"
        ></div>



        <!-- SUCCESS -->

        <div
            class="success-msg"
            id="loginSuccess"
        ></div>



        <!-- LOGIN FORM -->

        <form
            id="loginForm"
            autocomplete="on"
        >


            <!-- EMAIL -->

            <div class="form-group">

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>



            <!-- REMEMBER / FORGOT -->

            <div class="auth-meta">


                <label class="remember-label">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    <span>
                        Remember
                    </span>

                </label>



                <a
                    href="#"
                    id="forgotPasswordLink"
                >
                    Forgot Password?
                </a>


            </div>



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="loginButton"
                class="btn btn-primary auth-btn"
            >
                Login Now
            </button>


        </form>



        <!-- REGISTER -->

        <div class="auth-footer">

            <a href="register.html">

                Don't have an account?

                <i>
                    Register New
                </i>

            </a>

        </div>


    </div>

</div>



<!-- =====================================================
     SUPABASE
===================================================== -->


<!-- 1. Supabase library -->
<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- 2. Supabase configuration -->
<script src="../js/supabase.js"></script>


<!-- 3. Login logic -->
<script src="../js/login.js"></script>


<!-- 4. Main website script -->
<script src="../js/script.js"></script>


</body>

</html>
